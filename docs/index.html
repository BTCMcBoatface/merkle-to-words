<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>merkle ensemble — block rhythm player</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>merkle<span>ensemble</span></h1>
    <p class="tag" id="protocolTag">M2M-RHYTHM · bitcoin merkle roots → rhythm</p>
  </header>

  <main>
    <section id="slots" aria-label="Instrument slots"></section>

    <section id="mapSection" aria-label="Melody map">
      <h2>Melody map <span class="draft">M2M-NOTES v2</span></h2>
      <div id="mapBar">
        <span class="seg" id="barsSeg">
          <button data-bars="1" class="btn mini">1</button>
          <button data-bars="2" class="btn mini">2</button>
          <button data-bars="4" class="btn mini sel">4</button>
          <button data-bars="8" class="btn mini">8</button>
          <button data-bars="16" class="btn mini">16</button>
          <span class="seglbl">bars</span>
        </span>
        <label class="chk"><input type="checkbox" id="polyChk"> chords (≤7/column)</label>
        <span class="seg">
          <button id="keyDown" class="btn mini" title="transpose the whole map down a semitone (painted values untouched)">−1</button>
          <span id="keyLbl" class="keycap">±0</span>
          <button id="keyUp" class="btn mini" title="transpose the whole map up a semitone (painted values untouched)">+1</button>
        </span>
        <button id="foldBtn" class="btn mini" title="fold out sharps: natural rows only (painted sharps show as notch markers)">♯ fold</button>
        <span class="seg">
          <button id="octDown" class="btn mini">◀ 8vb</button>
          <button id="octUp" class="btn mini">8vb ▶</button>
        </span>
        <button id="srcBtn" class="btn mini">source: voice</button>
      </div>
      <div id="mapWrap"><canvas id="mapCanvas" width="640" height="338"></canvas></div>
      <div id="mapRow">
        <select id="fillSelect" aria-label="block to fill from"></select>
        <button id="fillBtn" class="btn">fill from block</button>
        <button id="clearMapBtn" class="btn">clear map</button>
      </div>
    </section>

    <section id="seqSection" aria-label="Drum sequencer">
      <h2>Drum sequencer <span class="draft">ribbons · quantize</span></h2>
      <div id="seqBar">
        <span class="seg" id="seqResSeg" title="paint grid — snap for writing new steps; never moves existing notes">
          <button data-sel="1" class="btn mini">1</button>
          <button data-sel="2" class="btn mini">&frac12;</button>
          <button data-sel="4" class="btn mini">&#9833;</button>
          <button data-sel="8" class="btn mini sel">&#9834;</button>
          <button data-sel="16" class="btn mini">&#9836;</button>
          <button id="seqTriBtn" class="btn mini" title="triplet mode: ♩→¼³, ♪→♪³ (nothing finer than eighth-triplets)">&#179;</button>
          <span class="seglbl">write</span>
        </span>
        <span class="seg" id="seqBqSeg" title="block rhythm timing — raw = exact merkle onsets (sacrosanct); quantize is a deliberate choice">
          <button data-bq="0" class="btn mini sel">raw</button>
          <button data-bq="480" class="btn mini">&frac14;</button>
          <button data-bq="240" class="btn mini">&frac18;</button>
          <button data-bq="120" class="btn mini">1/16</button>
          <span class="seglbl">block</span>
        </span>
        <span class="seg" id="seqBarsSeg">
          <button data-sbars="1" class="btn mini">1</button>
          <button data-sbars="2" class="btn mini">2</button>
          <button data-sbars="4" class="btn mini sel">4</button>
          <button data-sbars="8" class="btn mini">8</button>
          <button data-sbars="16" class="btn mini">16</button>
          <span class="seglbl">bars</span>
        </span>
        <button id="seqClearBtn" class="btn mini" title="clear all painted steps — block rhythm untouched">clear steps</button>
        <span class="seglbl">tap: hit ▸ rest ▸ clear · drag paints · right-drag clears · gutter pill flips raw/SEQ</span>
      </div>
      <div id="seqWrap"><canvas id="seqCanvas" width="640" height="106"></canvas></div>
    </section>

    <section id="shelfSection" aria-label="Block collection">
      <h2>Blocks <span class="count" id="blockCount"></span></h2>
      <div id="shelf"></div>
      <div id="fetchRow">
        <input id="heightInput" type="text" inputmode="numeric" placeholder="block height" aria-label="block height">
        <button id="fetchHeight" class="btn">fetch</button>
        <button id="fetchLatest" class="btn">get latest</button>
      </div>
      <div id="snapRow">
        <input id="snapName" type="text" placeholder="snapshot name" aria-label="snapshot name">
        <button id="snapSave" class="btn">💾 save</button>
        <div id="snapList"></div>
      </div>
    </section>
  </main>

  <footer id="transport">
    <button id="playBtn" class="btn primary">▶ play</button>
    <button id="liveBtn" class="btn" title="watch the chain: new blocks evict-oldest, place, and rotate the arrangement">◉ live</button>
    <label class="bpm"><input id="bpmInput" type="number" min="20" max="300" step="1" value="120" inputmode="numeric" aria-label="BPM">BPM</label>
    <label class="fx" title="reverb over the whole mix — one setting, stored in this browser only"><input id="reverbIn" type="range" min="0" max="100" step="1" value="0" aria-label="reverb amount"><span>reverb</span></label>
    <button id="modeBtn" class="btn" title="loop alignment mode">bars</button>
    <button id="resyncBtn" class="btn" title="reset all parts to bar 0 at the next boundary">⟲ re-align</button>
    <button id="copyBtn" class="btn" title="copy shareable session URL">⧉ link</button>
    <button id="loopBtn" class="btn" title="export the audible ensemble as one MIDI loop">⤓ loop</button>
    <button id="resetBtn" class="btn danger" title="clear arrangement — return all blocks to the shelf (press twice)">✕</button>
    <p id="status" role="status"></p>
  </footer>

  <div id="loopPop" class="loop-pop" hidden>
    <div class="thead"><span>ensemble loop · export</span><button id="loopX" title="close (or Esc)">✕</button></div>
    <div class="wrow"><span>file</span>
      <button data-t1="1" class="sel">per-track</button><button data-t1="0">single</button>
    </div>
    <div class="wrow"><span>drums</span>
      <button data-dm="keys" class="sel">Ch13·Keys</button><button data-dm="split">Ch1–4·Split</button>
    </div>
    <p id="loopSum"></p>
    <button id="loopDl" class="btn primary">⤓ download .mid</button>
  </div>

  <noscript>This player needs JavaScript (it derives rhythm patterns in your browser).</noscript>
  <script type="module" src="./js/ui.js"></script>
</body>
</html>
