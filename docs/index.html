<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>merkle ensemble — block rhythm player</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>merkle<span>ensemble</span></h1>
    <p class="tag" id="protocolTag">M2M-RHYTHM · bitcoin merkle roots → rhythm</p>
  </header>

  <main>
    <section id="slots" aria-label="Instrument slots"></section>

    <section id="mapSection" aria-label="Melody map">
      <h2>Melody map <span class="draft">M2M-NOTES v2</span></h2>
      <div id="mapBar">
        <span class="seg" id="barsSeg">
          <button data-bars="4" class="btn mini">4 bars</button>
          <button data-bars="8" class="btn mini">8</button>
          <button data-bars="16" class="btn mini">16</button>
        </span>
        <label class="chk"><input type="checkbox" id="polyChk"> chords (≤7/column)</label>
        <span class="seg">
          <button id="octDown" class="btn mini">◀ 8vb</button>
          <button id="octUp" class="btn mini">8vb ▶</button>
        </span>
        <button id="srcBtn" class="btn mini">source: voice</button>
      </div>
      <div id="mapWrap"><canvas id="mapCanvas" width="640" height="338"></canvas></div>
      <div id="mapRow">
        <select id="fillSelect" aria-label="block to fill from"></select>
        <button id="fillBtn" class="btn">fill from block</button>
        <button id="clearMapBtn" class="btn">clear map</button>
      </div>
    </section>

    <section id="shelfSection" aria-label="Block collection">
      <h2>Blocks <span class="count" id="blockCount"></span></h2>
      <div id="shelf"></div>
      <div id="fetchRow">
        <input id="heightInput" type="text" inputmode="numeric" placeholder="block height" aria-label="block height">
        <button id="fetchHeight" class="btn">fetch</button>
        <button id="fetchLatest" class="btn">get latest</button>
      </div>
      <div id="snapRow">
        <input id="snapName" type="text" placeholder="snapshot name" aria-label="snapshot name">
        <button id="snapSave" class="btn">💾 save</button>
        <div id="snapList"></div>
      </div>
    </section>
  </main>

  <footer id="transport">
    <button id="playBtn" class="btn primary">▶ play</button>
    <button id="liveBtn" class="btn" title="watch the chain: new blocks evict-oldest, place, and rotate the arrangement">◉ live</button>
    <label class="bpm"><input id="bpmInput" type="number" min="20" max="300" step="1" value="120" inputmode="numeric" aria-label="BPM">BPM</label>
    <button id="modeBtn" class="btn" title="loop alignment mode">bars</button>
    <button id="resyncBtn" class="btn" title="reset all parts to bar 0 at the next boundary">⟲ re-align</button>
    <button id="copyBtn" class="btn" title="copy shareable session URL">⧉ link</button>
    <button id="resetBtn" class="btn danger" title="clear session">✕</button>
    <p id="status" role="status"></p>
  </footer>

  <noscript>This player needs JavaScript (it derives rhythm patterns in your browser).</noscript>
  <script type="module" src="./js/ui.js"></script>
</body>
</html>
